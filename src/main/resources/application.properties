spring.application.name=trades
server.port=8280
server.address=127.0.0.1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

tradier.account-id=${TRADIER_ACCOUNT_ID:}
tradier.token=${TRADIER_ACCESS_TOKEN:}
tradier.live-account-id=${TRADIER_LIVE_ACCOUNT_ID:}
tradier.live-token=${TRADIER_LIVE_ACCESS_TOKEN:}
# Environment at startup (SANDBOX or LIVE); switchable at runtime from the order-entry page.
tradier.environment=${TRADIER_ENVIRONMENT:SANDBOX}

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/trades
spring.datasource.username=root
spring.datasource.password=
spring.sql.init.mode=always
